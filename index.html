<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>بودجه‌یار — دانلود اپ</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Vazirmatn"; background:#F4F4F2; color:#0A0A0A; text-align:center; padding:3rem 1rem; }
    [data-theme=dark] body { background:#0A0A0A; color:#F4F4F2; }
    h1 { font-size:2.8rem; }
    .stores { display:flex; gap:1rem; justify-content:center; margin:2rem 0; flex-wrap:wrap; }
    .store { background:#0A0A0A; color:#fff; padding:1rem 2rem; border-radius:8px; text-decoration:none; }
  </style>
</head>
<body>
  <button onclick="document.documentElement.toggleAttribute('data-theme')">تم</button>
  <h1>بودجه‌یار</h1>
  <p>مدیریت هزینه و بودجه به زبان فارسی. ساده، دقیق، خصوصی.</p>
  <div class="stores">
    <a class="store" href="#">دانلود از کافه‌بازار</a>
    <a class="store" href="#">دانلود از مای‌کت</a>
  </div>
  <p>رایگان برای ۳۰ روز اول.</p>
</body>
</html>
